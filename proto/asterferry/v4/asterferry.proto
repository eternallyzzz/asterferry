syntax = "proto3";

package asterferry.v4;

option go_package = "asterferry/internal/transport/wirev4;wirev4";

// Frame is the v4 protocol envelope. The Go transport adds a four-byte
// big-endian length prefix around its serialized form.
message Frame {
  uint32 version = 1;
  FrameType type = 2;
  uint64 request_id = 3;
  bytes payload = 4;
}

enum FrameType {
  FRAME_TYPE_UNSPECIFIED = 0;
  HELLO = 1;
  CHALLENGE = 2;
  AUTH = 3;
  AUTH_OK = 4;
  REGISTER = 5;
  REGISTER_RESULT = 6;
  OPEN_PROXY = 7;
  OPEN_REVERSE = 8;
  OPEN_OK = 9;
  OPEN_ERROR = 10;
  DATA = 11;
  PING = 12;
  PONG = 13;
  ERROR = 14;
}

enum Capability {
  CAPABILITY_UNSPECIFIED = 0;
  ERRORS_V1 = 1;
  LIMITS_V1 = 2;
  REVERSE_TCP = 10;
  REVERSE_UDP = 11;
  EGRESS_PROXY = 12;
  RELAY_BALANCED = 13;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  INVALID_FRAME = 1;
  UNSUPPORTED_VERSION = 2;
  CAPABILITY_MISMATCH = 3;
  LIMIT_MISMATCH = 4;
  AUTH_FAILED = 5;
  AGENT_LIMIT = 6;
  RESOURCE_EXHAUSTED = 7;
  POLICY_DENIED = 8;
  MAPPING_REJECTED = 9;
  INTERNAL = 10;
}

message Limits {
  uint64 max_frame_bytes = 1;
  uint64 max_record_bytes = 2;
  uint64 max_udp_bytes = 3;
  uint64 max_streams = 4;
}

message ProtocolError {
  ErrorCode code = 1;
  string detail = 2;
  bool retryable = 3;
}

message Hello {
  string agent_id = 1;
  repeated Capability capabilities = 2;
  Limits limits = 3;
}

message Challenge {
  bytes nonce = 1;
  repeated Capability capabilities = 2;
  Limits limits = 3;
}

message Auth {
  bytes mac = 1;
}

message AuthResult {
  ProtocolError error = 1;
}

message TunnelRegistration {
  string name = 1;
  string protocol = 2;
  uint32 gateway_port = 3;
  string profile = 4;
}

message Register {
  repeated TunnelRegistration mappings = 1;
}

message RegisterResult {
  repeated TunnelRegistration mappings = 1;
  ProtocolError error = 2;
}

message OpenProxy {
  string network = 1;
  string address = 2;
  uint32 port = 3;
  string profile = 4;
}

message OpenReverse {
  string name = 1;
  string protocol = 2;
  string profile = 3;
}

message OpenResult {
  ProtocolError error = 1;
}

message Data {
  bytes payload = 1;
  bytes padding = 2;
}

message Empty {}

message Error {
  ProtocolError error = 1;
}
