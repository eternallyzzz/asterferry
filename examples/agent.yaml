# AsterFerry v6 internal Agent configuration.
version: 6
role: agent

transport:
  alpn: "af-demo-9b7f2c1d"
  # One stream is reserved for control; 257 permits 256 data streams.
  max_bidi_remote_streams: 257
  # Optional high-BDP tuning. Zero/unset keeps quic-go defaults.
  # initial_stream_receive_window_bytes: 1048576
  # initial_connection_receive_window_bytes: 8388608
  # max_stream_read_buffer: 16777216
  # max_conn_read_buffer: 67108864
  # High-BDP links may benefit from larger OS UDP queues (measure first).
  # udp_read_buffer_bytes: 16777216
  # udp_write_buffer_bytes: 16777216
  handshake_timeout_seconds: 10
  idle_timeout_seconds: 1800
  keep_alive_seconds: 20

management:
  listen: "127.0.0.1:9091"
  auth:
    admin_token_file: "/etc/asterferry/management-admin.token"
    viewer_token_file: "/etc/asterferry/management-viewer.token"
  web:
    enabled: false
  # Non-loopback management.listen requires both TLS files.
  # tls:
  #   cert_file: "/etc/asterferry/management.crt"
  #   key_file: "/etc/asterferry/management.key"
  #   ca_file: "/etc/asterferry/management-ca.crt"

shutdown:
  # On SIGTERM/SIGINT, stop new traffic and wait up to this long for active
  # streams. The process then closes remaining sessions forcefully.
  grace_period_seconds: 30

# Optional identity metadata reserved for future Kubernetes coordination.
# This does not enable clustering; omit it for the normal single-node mode.
# cluster:
#   node_id: "agent-a"

limits:
  max_agents: 256
  max_connections_per_agent: 64
  max_streams_per_agent: 256
  max_frame_bytes: 16777216
  max_record_bytes: 65536
  max_write_batch_bytes: 262144
  max_udp_bytes: 65536
  dial_timeout_seconds: 10
  udp_idle_timeout_seconds: 30

obfuscation:
  proxy_profile: balanced
  reverse_profile: standard
  max_padding_bytes: 2048
  transport:
    mode: camouflage
    key_file: "/etc/asterferry/obfs.key"
    # Uncomment while rotating and mount the old key at this path.
    # previous_key_file: "/etc/asterferry/obfs.key.previous"
    handshake_shaping: true
    min_fragment_bytes: 512
    max_fragment_bytes: 1200
    max_wire_packet_bytes: 1280

logging:
  level: info
  format: json
  sampling:
    enabled: true
    rate_per_second: 5
    burst: 20
    summary_interval_seconds: 60
    max_keys: 4096
  expose_domain_at_debug: false

agent:
  id: edge-a
  server: "gateway.example.com:4433"
  token_file: "/etc/asterferry/edge-a.token"
  tls:
    ca_file: "/etc/asterferry/gateway-ca.crt"
    cert_file: "/etc/asterferry/edge-a.crt"
    key_file: "/etc/asterferry/edge-a.key"
    server_name: "gateway.example.com"

  proxy:
    inbounds:
      - tag: socks
        protocol: socks5
        listen: "127.0.0.1:1080"
        user: proxy-user
        password: change-this-password
      - tag: http
        protocol: http
        listen: "127.0.0.1:8080"
        user: proxy-user
        password: change-this-password
    default_route: gateway
    sniff:
      enabled: true
      max_bytes: 16384
      timeout_milliseconds: 250
    rules:
      - inbound: socks
        geoip: ["private", "CN"]
        route: direct
      - inbound: http
        domains: ["example.com"]
        route: direct

  reverse:
    - name: web
      protocol: tcp
      local: "127.0.0.1:8081"
      gateway_port: 28080
      gateway_bind: "127.0.0.1"
    - name: dns
      protocol: udp
      local: "127.0.0.1:53"
      gateway_port: 21003
      gateway_bind: "127.0.0.1"
