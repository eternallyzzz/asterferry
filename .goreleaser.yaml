# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: asterferry

before:
  hooks:
    - go mod verify

builds:
  - id: asterferry
    main: ./cmd/asterferry
    binary: asterferry
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
      - -tags=dashboard_assets
    ldflags:
      - -s -w -X asterferry/internal/buildinfo.Version={{ .Version }} -X asterferry/internal/buildinfo.Commit={{ .FullCommit }} -X asterferry/internal/buildinfo.BuildDate={{ .Date }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: asterferry
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "asterferry_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: SHA256SUMS

release:
  disable: true

changelog:
  disable: true
