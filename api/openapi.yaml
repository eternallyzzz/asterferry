        public_endpoint: { type: string }
        obfuscation: { $ref: '#/components/schemas/ObfuscationMetadata' }
        revision: { type: integer, format: int64, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }
    AssignmentInput:
      type: object
