      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CSRF' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AssignmentInput' } } } }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Assignment' } } } }, '409': { $ref: '#/components/responses/Conflict' } }
  /assignments/{assignmentId}:
    parameters: [{ name: assignmentId, in: path, required: true, schema: { type: string } }]
    get: { tags: [resources], operationId: getAssignment, security: [{ bearerAuth: [] }, { cookieAuth: [] }], responses: { '200': { description: Assignment, content: { application/json: { schema: { $ref: '#/components/schemas/Assignment' } } } } } }
    put:
      tags: [resources]
      operationId: updateAssignment
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CSRF' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AssignmentInput' } } } }
      responses: { '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Assignment' } } } }, '409': { $ref: '#/components/responses/Conflict' } }
    delete:
      tags: [resources]
      operationId: deleteAssignment
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CSRF' }]
      responses: { '204': { description: Deleted } }
  /enrollment-tokens:
    get: { tags: [operations], operationId: listEnrollmentTokens, security: [{ bearerAuth: [] }, { cookieAuth: [] }], responses: { '200': { description: Enrollment tokens without plaintext secrets, content: { application/json: { schema: { $ref: '#/components/schemas/EnrollmentTokenList' } } } } } }
    post:
      tags: [operations]
      operationId: createEnrollmentToken
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CSRF' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EnrollmentTokenRequest' } } } }
      responses: { '201': { description: Plaintext is returned once, content: { application/json: { schema: { $ref: '#/components/schemas/EnrollmentTokenResponse' } } } }, '409': { description: Request was already created; plaintext cannot be recovered, content: { application/json: { schema: { $ref: '#/components/schemas/SecretAlreadyCreated' } } } } }
  /enrollment-tokens/{tokenId}:
    delete:
      tags: [operations]
      operationId: revokeEnrollmentToken
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      parameters: [{ name: tokenId, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CSRF' }]
      responses: { '204': { description: Revoked } }
  /users:
    get: { tags: [auth], operationId: listUsers, security: [{ bearerAuth: [] }, { cookieAuth: [] }], responses: { '200': { description: Users, content: { application/json: { schema: { $ref: '#/components/schemas/UserList' } } } } } }
    post:
      tags: [auth]
      operationId: createUser
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CSRF' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UserInput' } } } }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } } }
  /users/{userId}/tokens:
    get: { tags: [auth], operationId: listUserTokens, security: [{ bearerAuth: [] }, { cookieAuth: [] }], parameters: [{ name: userId, in: path, required: true, schema: { type: string } }], responses: { '200': { description: Token metadata, content: { application/json: { schema: { $ref: '#/components/schemas/APITokenList' } } } } } }
    post:
      tags: [auth]
      operationId: createUserToken
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      parameters: [{ name: userId, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CSRF' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/APITokenRequest' } } } }
      responses: { '201': { description: Plaintext token returned once, content: { application/json: { schema: { $ref: '#/components/schemas/APITokenResponse' } } } }, '409': { description: Request was already created; plaintext cannot be recovered, content: { application/json: { schema: { $ref: '#/components/schemas/SecretAlreadyCreated' } } } } }
  /users/{userId}:
    parameters: [{ name: userId, in: path, required: true, schema: { type: string } }]
    get: { tags: [auth], operationId: getUser, security: [{ bearerAuth: [] }, { cookieAuth: [] }], responses: { '200': { description: User, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } } } }
    patch:
      tags: [auth]
      operationId: updateUser
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CSRF' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UserPatch' } } } }
      responses: { '200': { description: Updated user, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } } }
    delete:
      tags: [auth]
      operationId: deleteUser
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CSRF' }]
      responses: { '204': { description: Deleted user } }
  /users/{userId}/tokens/{tokenId}:
    delete:
      tags: [auth]
      operationId: revokeUserToken
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      parameters: [{ name: userId, in: path, required: true, schema: { type: string } }, { name: tokenId, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CSRF' }]
      responses: { '204': { description: Revoked } }
  /runtime/settings:
    get:
      tags: [runtime]
      operationId: getRuntimeSettings
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      responses: { '200': { description: Runtime operation settings, content: { application/json: { schema: { $ref: '#/components/schemas/RuntimeSettings' } } } } }
    put:
      tags: [runtime]
      operationId: setRuntimeSettings
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CSRF' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RuntimeSettingsInput' } } }
      responses: { '200': { description: Runtime operation settings updated, content: { application/json: { schema: { $ref: '#/components/schemas/RuntimeSettings' } } } } }
  /runtime/connections:
    get:
      tags: [runtime]
      operationId: listRuntimeConnections
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      parameters:
        - { name: node_id, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: type, in: query, schema: { type: string } }
        - { name: source_ip, in: query, schema: { type: string, description: IPv4 or IPv6 address } }
        - { name: peer_node_id, in: query, schema: { type: string } }
        - { name: gateway_id, in: query, schema: { type: string } }
        - { name: agent_id, in: query, schema: { type: string } }
        - { name: assignment_id, in: query, schema: { type: string } }
        - { name: service_id, in: query, schema: { type: string } }
        - { name: protocol, in: query, schema: { type: string, enum: [tcp, udp, quic] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000 } }
      responses: { '200': { description: Current and recently closed connection metadata, content: { application/json: { schema: { $ref: '#/components/schemas/RuntimeConnectionList' } } } } }
  /runtime/events:
    get:
      tags: [runtime]
      operationId: listRuntimeEvents
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      parameters: [{ name: node_id, in: query, schema: { type: string } }, { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000 } }]
      responses: { '200': { description: Runtime lifecycle events retained for 30 days, content: { application/json: { schema: { $ref: '#/components/schemas/RuntimeEventList' } } } } }
  /runtime/traffic:
    get:
      tags: [runtime]
      operationId: listRuntimeTraffic
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      parameters: [{ name: node_id, in: query, schema: { type: string } }, { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 2000 } }]
      responses: { '200': { description: Per-minute traffic rollups, content: { application/json: { schema: { $ref: '#/components/schemas/RuntimeTrafficList' } } } } }
  /runtime/stream:
    get:
      tags: [runtime]
      operationId: runtimeStream
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      parameters: [{ name: node_id, in: query, schema: { type: string } }]
      responses: { '200': { description: Server-sent runtime metadata change notifications, content: { text/event-stream: {} } } }
  /nodes/{nodeId}/runtime/actions:
    parameters: [{ $ref: '#/components/parameters/NodeId' }]
    post:
      tags: [runtime]
      operationId: runtimeAction
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CSRF' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RuntimeAction' } } }
      responses: { '202': { description: Runtime action queued, content: { application/json: { schema: { $ref: '#/components/schemas/RuntimeActionResponse' } } } }, '403': { description: Advanced operations are disabled, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } } }
  /nodes/{nodeId}/runtime/connections:
    parameters: [{ $ref: '#/components/parameters/NodeId' }]
    get:
      tags: [runtime]
      operationId: listNodeRuntimeConnections
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      parameters:
        - { name: state, in: query, schema: { type: string } }
        - { name: type, in: query, schema: { type: string } }
        - { name: source_ip, in: query, schema: { type: string, description: IPv4 or IPv6 address } }
        - { name: peer_node_id, in: query, schema: { type: string } }
        - { name: assignment_id, in: query, schema: { type: string } }
        - { name: service_id, in: query, schema: { type: string } }
        - { name: protocol, in: query, schema: { type: string, enum: [tcp, udp, quic] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000 } }
      responses: { '200': { description: Current and recently closed connection metadata for one Node, content: { application/json: { schema: { $ref: '#/components/schemas/RuntimeConnectionList' } } } } }
  /nodes/{nodeId}/runtime/connections/{connectionId}:
    parameters: [{ $ref: '#/components/parameters/NodeId' }, { name: connectionId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }]
    get:
      tags: [runtime]
      operationId: getNodeRuntimeConnection
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      responses:
        '200': { description: One current or recently closed connection metadata record, content: { application/json: { schema: { $ref: '#/components/schemas/RuntimeConnection' } } } }
  /nodes/{nodeId}/runtime/connections/{connectionId}/actions:
    parameters: [{ $ref: '#/components/parameters/NodeId' }, { name: connectionId, in: path, required: true, schema: { type: string } }]
    post:
      tags: [runtime]
      operationId: runtimeConnectionAction
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CSRF' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RuntimeAction' } } }
      responses: { '202': { description: Runtime action queued, content: { application/json: { schema: { $ref: '#/components/schemas/RuntimeActionResponse' } } } }, '403': { description: Advanced operations are disabled, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } } }
  /audit:
    get:
      tags: [audit]
      operationId: listAudit
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      parameters: [{ name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }]
      responses: { '200': { description: Audit records, content: { application/json: { schema: { $ref: '#/components/schemas/AuditList' } } } } }
  /events:
    get:
      tags: [audit]
      operationId: listEvents
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      parameters: [{ name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }]
      responses: { '200': { description: Event records, content: { application/json: { schema: { $ref: '#/components/schemas/AuditList' } } } } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
    cookieAuth: { type: apiKey, in: cookie, name: af_session }
    nodeEnrollmentAuth: { type: apiKey, in: header, name: X-AsterFerry-Enrollment-Token, description: One-time token returned by the Dashboard node installation command generator. }
  parameters:
    NodeId: { name: nodeId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
    ProxyId: { name: proxyId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
    RouteName: { name: routeName, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 256 } }
    IfMatch: { name: If-Match, in: header, required: false, description: The server requires this compare-and-swap revision for mutating resources and returns 428 when it is absent., schema: { type: string, pattern: '^[1-9][0-9]*$' } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: false, schema: { type: string, maxLength: 128 } }
    CSRF: { name: X-CSRF-Token, in: header, required: false, schema: { type: string, minLength: 32 } }
  responses:
    Unauthorized: { description: Authentication required }
    Conflict: { description: Revision or unique binding conflict, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  schemas:
    ControllerUpdateRequest:
      type: object
      properties: { version: { type: string, pattern: '^[0-9]+\.[0-9]+\.[0-9]+$' } }
    ControllerUpdateState:
      type: object
      required: [schema_version, current_version, channel, deployment, supported, state, updated_at]
      properties:
        schema_version: { type: integer }
        current_version: { type: string }
        channel: { type: string, enum: [stable] }
        deployment: { type: string }
        supported: { type: boolean }
        state: { type: string, enum: [disabled, checking, up_to_date, available, applying, failed, rolled_back, manual_required, unsupported] }
        latest_version: { type: string }
        latest_url: { type: string, format: uri }
        published_at: { type: string, format: date-time }
        last_checked_at: { type: string, format: date-time }
        last_error: { type: string }
        target_version: { type: string }
        previous_version: { type: string }
        updated_at: { type: string, format: date-time }
    ControllerUpdateResponse:
      type: object
      required: [reason, status]
      properties: { reason: { type: string }, status: { $ref: '#/components/schemas/ControllerUpdateState' } }
    NodeUpdateStatus:
      type: object
      required: [schema_version, node_id, state, supported, updated_at]
      properties:
        schema_version: { type: integer }
        node_id: { type: string }
        action_id: { type: string }
        current_version: { type: string }
        target_version: { type: string }
        latest_version: { type: string }
        latest_url: { type: string, format: uri }
        state: { type: string, enum: [up_to_date, applying, failed, rolled_back, manual_required, unsupported] }
        supported: { type: boolean }
        deployment: { type: string }
        platform: { type: string, enum: [linux, windows] }
        architecture: { type: string }
        reason: { type: string }
        last_error: { type: string }
        updated_at: { type: string, format: date-time }
    LoginRequest:
      type: object
      required: [username, password]
      properties: { username: { type: string }, password: { type: string, format: password } }
    LoginResponse:
      type: object
      required: [user, csrf_token]
      properties: { user: { $ref: '#/components/schemas/User' }, csrf_token: { type: string } }
    User:
      type: object
      required: [id, username, role, enabled, revision, created_at, updated_at]
      properties: { id: { type: string }, username: { type: string }, role: { type: string, enum: [viewer, operator, admin] }, enabled: { type: boolean }, revision: { type: integer, format: int64 }, created_at: { type: string, format: date-time }, updated_at: { type: string, format: date-time } }
    UserInput:
      type: object
      required: [username, password, role]
      properties: { username: { type: string }, password: { type: string, format: password }, role: { type: string, enum: [viewer, operator, admin] } }
    NodeInput:
      type: object
      required: [id, name]
      properties: { id: { type: string }, name: { type: string }, labels: { type: object, additionalProperties: { type: string } }, enabled: { type: boolean } }
    NodeSpec:
      description: The behavior selected for a Node. Exactly one typed document is present.
      oneOf:
        - $ref: '#/components/schemas/GatewayNodeSpec'
        - $ref: '#/components/schemas/AgentNodeSpec'
      discriminator:
        propertyName: kind
        mapping:
          gateway: '#/components/schemas/GatewayNodeSpec'
          agent: '#/components/schemas/AgentNodeSpec'
    GatewayNodeSpec:
      type: object
      required: [node_id, kind, gateway]
      properties:
        node_id: { type: string }
        kind: { type: string, enum: [gateway] }
        gateway: { $ref: '#/components/schemas/GatewaySpec' }
        revision: { type: integer, format: int64, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }
    AgentNodeSpec:
      type: object
      required: [node_id, kind, agent]
      properties:
        node_id: { type: string }
        kind: { type: string, enum: [agent] }
        agent: { $ref: '#/components/schemas/AgentSpec' }
        revision: { type: integer, format: int64, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }
    NodeBootstrapRequest:
      type: object
      required: [platform, arch, script_source]
      properties:
        platform: { type: string, enum: [linux, windows] }
        arch: { type: string, enum: [amd64, arm64] }
        script_source: { type: string, enum: [controller, github], default: controller, description: Where the one-line installer script is downloaded from. The Controller option is recommended. }
    NodeBootstrapResponse:
      type: object
      required: [node_id, platform, arch, version, script_source, installer_url, expires_at, command, state]
      properties:
        installation_id: { type: string, description: Pending installation identifier; set only by the install-first endpoint. }
        state: { type: string, enum: [install, replacement, pending], description: install for a new identity, replacement for a decommissioned identity being re-enrolled, and pending for an install-first intent that has not enrolled yet. }
        node_id: { type: string }
        platform: { type: string, enum: [linux, windows] }
        arch: { type: string, enum: [amd64, arm64] }
        version: { type: string, pattern: '^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$' }
        script_source: { type: string, enum: [controller, github] }
        installer_url: { type: string, format: uri, description: Exact installer script URL used by the generated command. }
        expires_at: { type: string, format: date-time }
        command: { type: string }
    NodeInstallationRequest:
      type: object
      required: [name, platform, arch, script_source]
      description: Create a pending installation intent. The Controller generates node_id when omitted. Enrollment creates the Node.
      properties:
        node_id: { type: string, minLength: 1, maxLength: 128, description: Optional immutable identity override; omit this field to let the Controller generate a unique ID. }
        name: { type: string, minLength: 1, maxLength: 256 }
        labels: { type: object, additionalProperties: { type: string } }
        enabled: { type: boolean, description: Defaults to true when omitted. }
        platform: { type: string, enum: [linux, windows] }
        arch: { type: string, enum: [amd64, arm64] }
        script_source: { type: string, enum: [controller, github], default: controller, description: Where the one-line installer script is downloaded from. The Controller option is recommended. }
    PendingNodeInstallation:
      type: object
      required: [node_id, name, enabled, platform, arch, script_source, expires_at, created_at]
      properties:
        node_id: { type: string }
        name: { type: string }
        labels: { type: object, additionalProperties: { type: string } }
        enabled: { type: boolean }
        platform: { type: string, enum: [linux, windows] }
        arch: { type: string, enum: [amd64, arm64] }
        script_source: { type: string, enum: [controller, github] }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    PendingNodeInstallationList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/PendingNodeInstallation' } }
    NodePatch:
      type: object
      properties: { name: { type: string }, labels: { type: object, additionalProperties: { type: string } }, enabled: { type: boolean }, certificate_state: { type: string, enum: [pending, active, revoked, expired, decommissioned] }, certificate_serial: { type: string } }
    Node:
      type: object
      required: [id, name, enabled, certificate_state, revision, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        labels: { type: object, additionalProperties: { type: string } }
        enabled: { type: boolean }
        spec_kind: { type: string, enum: [gateway, agent], description: Configured behavior projection; omitted until a spec is saved. }
        certificate_state: { type: string, enum: [pending, active, revoked, expired, decommissioned] }
        certificate_serial: { type: string }
        revision: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    NodeList: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Node' } } } }
    Selector:
      type: object
      properties:
        match_labels: { type: object, additionalProperties: { type: string } }
    Listener:
      type: object
      required: [protocol, bind, port, enabled]
      properties:
        protocol: { type: string, enum: [tcp, udp] }
        bind: { type: string }
        port: { type: integer, minimum: 1, maximum: 65535 }
        enabled: { type: boolean }
    Capacity:
      type: object
      required: [max_agents, max_connections, max_services]
      properties:
        max_agents: { type: integer, minimum: 0 }
        max_connections: { type: integer, minimum: 0 }
        max_services: { type: integer, minimum: 0 }
    PortRange:
      type: object
      required: [min, max]
      properties:
        min: { type: integer, minimum: 1, maximum: 65535 }
        max: { type: integer, minimum: 1, maximum: 65535 }
    PortPool:
      type: object
      properties:
        tcp: { type: array, items: { $ref: '#/components/schemas/PortRange' } }
        udp: { type: array, items: { $ref: '#/components/schemas/PortRange' } }
    TransportPolicy:
      type: object
      required: [alpn, max_streams, max_frame_bytes, max_datagram_bytes, handshake_timeout_seconds, idle_timeout_seconds]
      properties:
        alpn: { type: string }
        max_streams: { type: integer, minimum: 0 }
        max_frame_bytes: { type: integer, minimum: 0 }
        max_datagram_bytes: { type: integer, minimum: 0 }
        handshake_timeout_seconds: { type: integer, minimum: 0 }
        idle_timeout_seconds: { type: integer, minimum: 0 }
    ObfuscationMetadata:
      type: object
      required: [mode, max_padding_bytes, handshake_shaping]
      properties:
        mode: { type: string, enum: [standard, camouflage] }
        key_id: { type: string }
        previous_key_id: { type: string }
        max_padding_bytes: { type: integer, minimum: 0 }
        handshake_shaping: { type: boolean }
    ObfuscationWrite:
      allOf:
        - $ref: '#/components/schemas/ObfuscationMetadata'
        - type: object
          properties:
            key: { type: string, format: byte, writeOnly: true }
            previous_key: { type: string, format: byte, writeOnly: true }
            key_ciphertext: { type: string, format: byte, writeOnly: true }
            previous_key_ciphertext: { type: string, format: byte, writeOnly: true }
    ProxySpec:
      type: object
      required: [id, protocol, bind, route, enabled]
      properties:
        id: { type: string }
        protocol: { type: string, enum: [tcp, udp] }
        bind: { type: string }
        route: { type: string }
        enabled: { type: boolean }
    RouteRule:
      type: object
      required: [name, destination, enabled]
      properties:
        name: { type: string }
        cidrs: { type: array, items: { type: string } }
