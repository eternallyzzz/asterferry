        protocol: { type: string, enum: [tcp, udp] }
        local_target: { type: string }
        public_bind: { type: string }
        public_port: { type: integer, minimum: 0, maximum: 65535 }
        gateway_selector: { $ref: '#/components/schemas/Selector' }
        enabled: { type: boolean }
    ServicePatch:
      type: object
