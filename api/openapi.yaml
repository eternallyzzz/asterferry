        geoip: { type: array, items: { type: string } }
        destination: { type: string }
        enabled: { type: boolean }
    AgentLimits:
      type: object
      required: [max_connections, max_streams, max_buffer_bytes]
      properties:
        max_connections: { type: integer, minimum: 0 }
        max_streams: { type: integer, minimum: 0 }
        max_buffer_bytes: { type: integer, minimum: 0 }
    LoggingPolicy:
      type: object
      required: [level, format]
      properties:
        level: { type: string }
        format: { type: string }
    GatewaySpec:
      type: object
      required: [node_id, public_endpoints, capacity, port_pool, transport, obfuscation, egress]
      properties:
        node_id: { type: string }
        public_endpoints: { type: array, items: { type: string } }
        listeners: { type: array, items: { $ref: '#/components/schemas/Listener' } }
        labels: { type: object, additionalProperties: { type: string } }
        capacity: { $ref: '#/components/schemas/Capacity' }
        port_pool: { $ref: '#/components/schemas/PortPool' }
        transport: { $ref: '#/components/schemas/TransportPolicy' }
        obfuscation: { $ref: '#/components/schemas/ObfuscationMetadata' }
        egress: { $ref: '#/components/schemas/EgressPolicy' }
        revision: { type: integer, format: int64, readOnly: true }
    AgentSpec:
      type: object
      required: [node_id, gateway_selector, proxies, routes, limits, egress, logging]
      description: Agent writes require gateway_id. gateway_selector-only documents are accepted for legacy compatibility.
      properties:
        node_id: { type: string }
        gateway_id: { type: string, description: Exact enrolled Gateway node selected for this Agent }
        gateway_selector: { $ref: '#/components/schemas/Selector' }
        proxies: { type: array, items: { $ref: '#/components/schemas/ProxySpec' } }
        routes: { type: array, items: { $ref: '#/components/schemas/RouteRule' } }
        limits: { $ref: '#/components/schemas/AgentLimits' }
        egress: { $ref: '#/components/schemas/EgressPolicy' }
        logging: { $ref: '#/components/schemas/LoggingPolicy' }
        revision: { type: integer, format: int64, readOnly: true }
    DesiredSnapshot:
      type: object
      required: [schema_version, node_id, generation, checksum]
      properties:
        schema_version: { type: integer, minimum: 1 }
        node_id: { type: string }
        generation: { type: integer, format: int64, minimum: 0 }
        checksum: { type: string }
        gateway: { $ref: '#/components/schemas/GatewaySpec' }
        agent: { $ref: '#/components/schemas/AgentSpec' }
        services: { type: array, items: { $ref: '#/components/schemas/Service' } }
        assignments: { type: array, items: { $ref: '#/components/schemas/Assignment' } }
    NodeActionResponse:
      type: object
      required: [node_id, action, state]
      properties:
        node_id: { type: string }
        action: { type: string }
        requested_by: { type: string }
        state: { type: string }
        assignments: { type: array, items: { $ref: '#/components/schemas/Assignment' } }
        status: { $ref: '#/components/schemas/NodeUpdateStatus' }
    ScheduleNodeResponse:
      type: object
      required: [node_id, action, assignments]
      properties:
        node_id: { type: string }
        action: { type: string, enum: [schedule] }
        assignments: { type: array, items: { $ref: '#/components/schemas/Assignment' } }
    RuntimeMetrics:
      type: object
      description: Controller-visible runtime metrics. Adding a field changes the protocol/API contract.
      properties:
        active_streams: { type: integer, format: int64, minimum: 0 }
        active_sessions: { type: integer, format: int64, minimum: 0 }
        active_egress: { type: integer, format: int64, minimum: 0 }
        udp_oversize_drops: { type: integer, format: int64, minimum: 0 }
        geoip_up: { type: boolean }
        active_connections: { type: integer, format: int64, minimum: 0 }
        active_flows: { type: integer, format: int64, minimum: 0 }
        runtime_bytes_in_total: { type: integer, format: int64, minimum: 0 }
        runtime_bytes_out_total: { type: integer, format: int64, minimum: 0 }
        runtime_opened_total: { type: integer, format: int64, minimum: 0 }
        runtime_closed_total: { type: integer, format: int64, minimum: 0 }
        runtime_rejected_total: { type: integer, format: int64, minimum: 0 }
        runtime_rate_limited_total: { type: integer, format: int64, minimum: 0 }
        runtime_telemetry_dropped_total: { type: integer, format: int64, minimum: 0 }
    SessionSummary: { type: object, required: [id, peer_id, started_at, streams], properties: { id: { type: string }, peer_id: { type: string }, started_at: { type: string, format: date-time }, streams: { type: integer, minimum: 0 } } }
    ListenerState: { type: object, required: [protocol, bind, port, ready], properties: { protocol: { type: string, enum: [tcp, udp] }, bind: { type: string }, port: { type: integer, minimum: 1, maximum: 65535 }, ready: { type: boolean } } }
    SystemInfo:
      type: object
      description: Latest bounded host and resource data reported by a Node.
      required: [collected_at]
      properties:
        hostname: { type: string }
        os: { type: string }
        distribution: { type: string }
        distribution_version: { type: string }
        kernel: { type: string }
        architecture: { type: string }
        cpu_model: { type: string }
        logical_cpus: { type: integer, minimum: 0 }
        node_version: { type: string }
        go_version: { type: string }
        service_mode: { type: string }
        ip_addresses: { type: array, items: { type: string } }
        uptime_seconds: { type: integer, format: int64, minimum: 0 }
        cpu_usage_percent: { type: number, format: double, minimum: 0, maximum: 100 }
        load_average_1m: { type: number, format: double, minimum: 0 }
        memory_total_bytes: { type: integer, format: int64, minimum: 0 }
        memory_available_bytes: { type: integer, format: int64, minimum: 0 }
        disk_total_bytes: { type: integer, format: int64, minimum: 0 }
        disk_free_bytes: { type: integer, format: int64, minimum: 0 }
        collected_at: { type: string, format: date-time }
    ObservedState:
