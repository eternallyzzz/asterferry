        sessions: { type: array, items: { $ref: '#/components/schemas/SessionSummary' } }
        listeners: { type: array, items: { $ref: '#/components/schemas/ListenerState' } }
        metrics: { $ref: '#/components/schemas/RuntimeMetrics' }
        system_info: { $ref: '#/components/schemas/SystemInfo' }
        observed_at: { type: string, format: date-time }
    EgressPolicy:
      type: object
      required: [enabled, max_connections]
      properties:
        enabled: { type: boolean }
        tcp_ports: { type: array, items: { type: string, pattern: '^[1-9][0-9]{0,4}(-[1-9][0-9]{0,4})?$' } }
        udp_ports: { type: array, items: { type: string, pattern: '^[1-9][0-9]{0,4}(-[1-9][0-9]{0,4})?$' } }
        allow_cidrs: { type: array, items: { type: string } }
        allow_special_cidrs: { type: array, items: { type: string } }
        max_connections: { type: integer, minimum: 0, maximum: 1048576 }
    Binding:
      type: object
      required: [service_id, protocol, bind, port]
      properties:
        service_id: { type: string }
        protocol: { type: string, enum: [tcp, udp] }
        bind: { type: string }
        port: { type: integer, minimum: 0, maximum: 65535 }
    Service:
