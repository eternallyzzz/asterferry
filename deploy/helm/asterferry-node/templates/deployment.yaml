apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "asterferry-node.fullname" . }}
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: {{ include "asterferry-node.name" . }} }
  template:
    metadata:
      labels: { app.kubernetes.io/name: {{ include "asterferry-node.name" . }} }
    spec:
      # Secret volumes are immutable/read-only. Copy the enrollment seed into
      # the node state PVC once so Runtime can atomically persist certificate
      # rotations without ever exposing the Secret as a writable mount.
      initContainers:
        - name: install-bootstrap
          image: "{{ .Values.bootstrapInitImage }}"
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - >-
              set -eu;
              if [ ! -s /var/lib/asterferry/state/bootstrap.json ]; then
                cp /var/lib/asterferry/bootstrap-source/{{ .Values.bootstrapKey }} /var/lib/asterferry/state/bootstrap.json;
                chmod 600 /var/lib/asterferry/state/bootstrap.json;
              fi
          volumeMounts:
            - name: bootstrap-source
              mountPath: /var/lib/asterferry/bootstrap-source
              readOnly: true
            - name: state
              mountPath: /var/lib/asterferry/state
      containers:
        - name: node
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ default .Chart.AppVersion .Values.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          workingDir: /var/lib/asterferry
          args:
            - node
            - run
            - --bootstrap
            - /var/lib/asterferry/state/bootstrap.json
{{- if .Values.geoip.enabled }}
            - --geoip-db
            - {{ .Values.geoip.path | quote }}
{{- end }}
          ports:
            - name: data
              containerPort: {{ .Values.dataPort }}
              protocol: UDP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - name: state
              mountPath: /var/lib/asterferry/state
{{- if .Values.geoip.enabled }}
            - name: geoip
              mountPath: /var/lib/asterferry/geoip
              readOnly: true
{{- end }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: bootstrap-source
          secret:
            secretName: {{ .Values.bootstrapSecret }}
        - name: state
          persistentVolumeClaim:
            claimName: {{ include "asterferry-node.fullname" . }}-state
{{- if .Values.geoip.enabled }}
        - name: geoip
          configMap:
            name: {{ required "geoip.existingConfigMap is required when geoip.enabled is true" .Values.geoip.existingConfigMap }}
            items:
              - key: {{ .Values.geoip.databaseKey | quote }}
                path: cn.mmdb
{{- end }}
