image:
  repository: ghcr.io/eternallyzzz/asterferry
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
bootstrapSecret: asterferry-node-bootstrap
bootstrapKey: bootstrap.json
bootstrapInitImage: busybox:1.36
stateSize: 1Gi
stateStorageClass: ""
dataPort: 4433
geoip:
  # GeoIP data is an external, versioned release resource. Keep disabled
  # unless an operator supplies a reviewed ConfigMap containing the database.
  enabled: false
  existingConfigMap: ""
  databaseKey: cn.mmdb
  path: /var/lib/asterferry/geoip/cn.mmdb
resources: {}
