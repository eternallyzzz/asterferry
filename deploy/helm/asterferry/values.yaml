role: gateway

image:
  repository: ghcr.io/eternallyzzz/asterferry
  # Empty selects the chart application version. Set this explicitly for
  # local images or use digest to pin an immutable registry artifact.
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Keep the configuration file separate from the image. Either reference an
# existing ConfigMap containing config.yaml or provide config.content.
config:
  existingConfigMap: asterferry-config
  key: config.yaml
  content: ""

# Secrets are intentionally not generated by this chart. Create one out of
# band and mount its files at the paths used by the configuration. Camouflage
# mode additionally expects obfs.key (and optionally obfs.key.previous).
secret:
  existingSecret: asterferry-secrets
  mountPath: /etc/asterferry/secrets

# 0 selects 9090 for Gateway and 9091 for Agent.
managementPort: 0

serviceAccount:
  create: true
  automount: false
  name: ""

gateway:
  service:
    type: LoadBalancer
    annotations: {}
    externalTrafficPolicy: Cluster
    ports:
      - name: quic
        protocol: UDP
        port: 4433
        targetPort: 4433
      - name: reverse-web
        protocol: TCP
        port: 28080
        targetPort: 28080
      - name: reverse-dns
        protocol: UDP
        port: 21003
        targetPort: 21003

agent:
  service:
    enabled: false
    type: ClusterIP
    annotations: {}
    ports:
      - name: socks
        protocol: TCP
        port: 1080
        targetPort: 1080
      - name: http
        protocol: TCP
        port: 8080
        targetPort: 8080

replicaCount: 1
# Keep this greater than shutdown.grace_period_seconds to leave kubelet a
# small buffer after the application has completed its bounded drain.
terminationGracePeriodSeconds: 35
podAnnotations: {}
podLabels: {}
env: []

probes:
  enabled: true
  # Match management.tls: use https when the management listener has TLS.
  scheme: http
  # Only use this for a loopback probe when the management certificate is not
  # trusted by the container's system roots.
  insecureTLS: false
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 6

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
