{{- if and (ne .Values.role "gateway") (ne .Values.role "agent") }}
{{- fail "role must be gateway or agent" }}
{{- end }}
{{- if and (ne .Values.probes.scheme "http") (ne .Values.probes.scheme "https") }}
{{- fail "probes.scheme must be http or https" }}
{{- end }}
{{- if and .Values.probes.insecureTLS (ne .Values.probes.scheme "https") }}
{{- fail "probes.insecureTLS requires probes.scheme=https" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "asterferry.fullname" . }}
  labels:
    {{- include "asterferry.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "asterferry.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "asterferry.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: {{ .Values.role }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "asterferry.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: asterferry
          image: {{ include "asterferry.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - {{ .Values.role | quote }}
            - "--config"
            - "/etc/asterferry/config.yaml"
          {{- with .Values.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: management
              containerPort: {{ include "asterferry.managementPort" . | trim }}
              protocol: TCP
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/asterferry/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: secrets
              mountPath: {{ .Values.secret.mountPath }}
              readOnly: true
          {{- if .Values.probes.enabled }}
          readinessProbe:
            exec:
              command:
                - /usr/local/bin/asterferry
                - healthcheck
                {{- if .Values.probes.insecureTLS }}
                - --insecure-tls
                {{- end }}
                - --url
                - {{ .Values.probes.scheme }}://127.0.0.1:{{ include "asterferry.managementPort" . | trim }}/readyz
            initialDelaySeconds: {{ .Values.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.failureThreshold }}
          livenessProbe:
            exec:
              command:
                - /usr/local/bin/asterferry
                - healthcheck
                {{- if .Values.probes.insecureTLS }}
                - --insecure-tls
                {{- end }}
                - --url
                - {{ .Values.probes.scheme }}://127.0.0.1:{{ include "asterferry.managementPort" . | trim }}/healthz
            initialDelaySeconds: {{ .Values.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.failureThreshold }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "asterferry.configMapName" . }}
            items:
              - key: {{ .Values.config.key | quote }}
                path: config.yaml
        - name: secrets
          secret:
            secretName: {{ include "asterferry.secretName" . }}
            defaultMode: 288
