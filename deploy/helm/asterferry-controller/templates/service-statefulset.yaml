{{- if .Values.controller.highAvailability.enabled }}
{{- if ne (int .Values.controller.replicas) 2 }}
{{- fail "controller.highAvailability.enabled requires controller.replicas=2" }}
{{- end }}
{{- if empty .Values.controller.highAvailability.existingSecret }}
{{- fail "controller.highAvailability.existingSecret is required when HA is enabled" }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "asterferry-controller.fullname" . }}
  annotations: {{- toYaml .Values.service.annotations | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: { app.kubernetes.io/name: {{ include "asterferry-controller.name" . }} }
  ports:
    - name: https
      port: {{ .Values.controller.httpsPort }}
      targetPort: https
    - name: grpc
      port: {{ .Values.controller.grpcPort }}
      targetPort: grpc
{{- if .Values.metrics.enabled }}
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "asterferry-controller.fullname" . }}-headless
  annotations: {{- toYaml .Values.service.annotations | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: { app.kubernetes.io/name: {{ include "asterferry-controller.name" . }} }
  ports:
    - name: https
      port: {{ .Values.controller.httpsPort }}
      targetPort: https
    - name: grpc
      port: {{ .Values.controller.grpcPort }}
      targetPort: grpc
{{- if .Values.metrics.enabled }}
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
{{- end }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "asterferry-controller.fullname" . }}
spec:
  serviceName: {{ include "asterferry-controller.fullname" . }}-headless
  replicas: {{ .Values.controller.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/name: {{ include "asterferry-controller.name" . }} }
  template:
    metadata:
      labels: { app.kubernetes.io/name: {{ include "asterferry-controller.name" . }} }
    spec:
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        fsGroup: 10001
      containers:
        - name: controller
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ default .Chart.AppVersion .Values.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - controller
            - run
            - --config
{{- if .Values.controller.highAvailability.enabled }}
            - {{ printf "%s/controller.json" .Values.controller.highAvailability.secretMountPath | quote }}
{{- else }}
            - {{ .Values.controller.configPath | quote }}
{{- end }}
            - --metrics-listen
            - {{ if .Values.metrics.enabled }}{{ .Values.metrics.listen | quote }}{{ else }}""{{ end }}
          ports:
            - name: https
              containerPort: {{ .Values.controller.httpsPort }}
            - name: grpc
              containerPort: {{ .Values.controller.grpcPort }}
{{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
{{- end }}
          volumeMounts:
{{- if .Values.controller.highAvailability.enabled }}
            - name: controller-identity
              mountPath: {{ .Values.controller.highAvailability.secretMountPath }}
              readOnly: true
{{- else }}
            - name: data
              mountPath: /var/lib/asterferry
{{- end }}
          readinessProbe:
            httpGet: { path: /readyz, port: https, scheme: HTTPS }
          livenessProbe:
            httpGet: { path: /healthz, port: https, scheme: HTTPS }
          resources: {{- toYaml .Values.resources | nindent 12 }}
{{- if .Values.controller.highAvailability.enabled }}
      volumes:
        - name: controller-identity
          secret:
            secretName: {{ .Values.controller.highAvailability.existingSecret }}
            defaultMode: 0440
{{- end }}
{{- if not .Values.controller.highAvailability.enabled }}
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: {{ .Values.controller.dataSize }} }
{{- end }}
