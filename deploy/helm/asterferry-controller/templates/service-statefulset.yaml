apiVersion: v1
kind: Service
metadata:
  name: {{ include "asterferry-controller.fullname" . }}
  annotations: {{- toYaml .Values.service.annotations | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: { app.kubernetes.io/name: {{ include "asterferry-controller.name" . }} }
  ports:
    - name: https
      port: {{ .Values.controller.httpsPort }}
      targetPort: https
    - name: grpc
      port: {{ .Values.controller.grpcPort }}
      targetPort: grpc
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "asterferry-controller.fullname" . }}
spec:
  serviceName: {{ include "asterferry-controller.fullname" . }}
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: {{ include "asterferry-controller.name" . }} }
  template:
    metadata:
      labels: { app.kubernetes.io/name: {{ include "asterferry-controller.name" . }} }
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: controller
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["controller", "run", "--config", "{{ .Values.controller.configPath }}"]
          ports:
            - name: https
              containerPort: {{ .Values.controller.httpsPort }}
            - name: grpc
              containerPort: {{ .Values.controller.grpcPort }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/asterferry
          readinessProbe:
            httpGet: { path: /healthz, port: https, scheme: HTTPS }
          livenessProbe:
            httpGet: { path: /healthz, port: https, scheme: HTTPS }
          resources: {{- toYaml .Values.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: {{ .Values.controller.dataSize }} }
