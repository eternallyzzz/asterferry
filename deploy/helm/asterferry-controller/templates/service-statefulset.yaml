apiVersion: v1
kind: Service
metadata:
  name: {{ include "asterferry-controller.fullname" . }}
  annotations: {{- toYaml .Values.service.annotations | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: { app.kubernetes.io/name: {{ include "asterferry-controller.name" . }} }
  ports:
    - name: https
      port: {{ .Values.controller.httpsPort }}
      targetPort: https
    - name: grpc
      port: {{ .Values.controller.grpcPort }}
      targetPort: grpc
{{- if .Values.metrics.enabled }}
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
{{- end }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "asterferry-controller.fullname" . }}
spec:
  serviceName: {{ include "asterferry-controller.fullname" . }}
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: {{ include "asterferry-controller.name" . }} }
  template:
    metadata:
      labels: { app.kubernetes.io/name: {{ include "asterferry-controller.name" . }} }
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: controller
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ default .Chart.AppVersion .Values.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - controller
            - run
            - --config
            - {{ .Values.controller.configPath | quote }}
{{- if .Values.metrics.enabled }}
            - --metrics-listen
            - {{ .Values.metrics.listen | quote }}
{{- end }}
          ports:
            - name: https
              containerPort: {{ .Values.controller.httpsPort }}
            - name: grpc
              containerPort: {{ .Values.controller.grpcPort }}
{{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
{{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/asterferry
          readinessProbe:
            httpGet: { path: /healthz, port: https, scheme: HTTPS }
          livenessProbe:
            httpGet: { path: /healthz, port: https, scheme: HTTPS }
          resources: {{- toYaml .Values.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: {{ .Values.controller.dataSize }} }
