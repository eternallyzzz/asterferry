name: Container

on:
  pull_request:
    paths:
      - ".github/workflows/container.yml"
      - "Dockerfile"
      - ".dockerignore"
      - "deploy/docker/**"
      - "deploy/helm/**"
      - "go.mod"
      - "go.sum"
      - "web/dashboard/**"
      - "cmd/**"
      - "internal/**"
  push:
    branches:
      - main
    tags:
      - "v*"

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Go and Helm checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.7"
          cache: true
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: web/dashboard/package-lock.json
      - name: Verify Dashboard dependencies and build
        run: |
          npm --prefix web/dashboard ci
          npm --prefix web/dashboard run lint
          npm --prefix web/dashboard test
          npm --prefix web/dashboard run build
          npm --prefix web/dashboard audit --registry=https://registry.npmjs.org --omit=dev --audit-level=high
          git diff --exit-code -- internal/dashboard/dist
      - name: Verify Go modules
        run: go mod verify
      - name: Run tests
        run: go test ./...
      - name: Run race tests
        run: go test -race ./...
      - name: Run vet
        run: go vet ./...
      - name: Run staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.6.1 ./...
      - name: Run vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - name: Verify QUIC implementation migration
        shell: bash
        run: |
          ! rg -n "golang.org/x/net/quic" --glob "*.go" .
          ! rg -n "github.com/quic-go/quic-go" --glob "*.go" internal/agent internal/gateway internal/relay
      - name: Build binary
        run: go build ./cmd/asterferry
      - name: Set up Helm
        uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4
      - name: Lint Helm chart
        run: helm lint deploy/helm/asterferry
      - name: Render Gateway chart
        run: helm template gateway deploy/helm/asterferry --set role=gateway
      - name: Render Agent chart
        run: helm template agent deploy/helm/asterferry --set role=agent

  image:
    name: Build and publish image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/eternallyzzz/asterferry
          tags: |
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ startsWith(github.ref, 'refs/tags/v') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version || 'dev' }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
