name: Container

on:
  pull_request:
    paths:
      - ".github/workflows/container.yml"
      - "Dockerfile"
      - ".dockerignore"
      - "deploy/docker/**"
      - "deploy/helm/**"
      - "go.mod"
      - "go.sum"
      - "web/dashboard/**"
      - "cmd/**"
      - "internal/**"
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    name: Go and Helm checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.7"
          cache: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: web/dashboard/package-lock.json
      - name: Verify Dashboard dependencies and build
        run: |
          npm --prefix web/dashboard ci
          npm --prefix web/dashboard run lint
          npm --prefix web/dashboard test
          npm --prefix web/dashboard run build
          git diff --exit-code -- internal/dashboard/dist
      - name: Run tests
        run: go test ./...
      - name: Run race tests
        run: go test -race ./...
      - name: Run vet
        run: go vet ./...
      - name: Verify QUIC implementation migration
        shell: bash
        run: |
          ! rg -n "golang.org/x/net/quic" --glob "*.go" .
          ! rg -n "github.com/quic-go/quic-go" --glob "*.go" internal/agent internal/gateway internal/relay
      - name: Build binary
        run: go build ./cmd/asterferry
      - name: Set up Helm
        uses: azure/setup-helm@v4
      - name: Lint Helm chart
        run: helm lint deploy/helm/asterferry
      - name: Render Gateway chart
        run: helm template gateway deploy/helm/asterferry --set role=gateway
      - name: Render Agent chart
        run: helm template agent deploy/helm/asterferry --set role=agent

  image:
    name: Build and publish image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/eternallyzzz/asterferry
          tags: |
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version || 'dev' }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
