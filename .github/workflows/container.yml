name: CI and Release

on:
  pull_request:
    paths:
      - ".github/**"
      - ".dockerignore"
      - ".goreleaser.yaml"
      - "CHANGELOG.md"
      - "Dockerfile"
      - ".toolchain.json"
      - "README.md"
      - "api/**"
      - "deploy/**"
      - "docs/**"
      - "examples/**"
      - "go.mod"
      - "go.sum"
      - "proto/**"
      - "scripts/**"
      - "web/dashboard/**"
      - "cmd/**"
      - "internal/**"
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      build_image:
        description: Build a local development image for Dockerfile verification (never push it)
        required: true
        default: false
        type: boolean

concurrency:
  group: ci-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Go and Helm checks (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: asterferry
          POSTGRES_DB: asterferry
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d asterferry"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      ASTERFERRY_TEST_POSTGRES_URL: postgres://postgres:asterferry@127.0.0.1:5432/asterferry?sslmode=disable
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.7"
          cache: true
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: web/dashboard/package-lock.json
      - name: Pin npm toolchain
        run: npm install --global npm@12.0.2 --registry=https://registry.npmjs.org
      - name: Verify Dashboard dependencies and build
        run: |
          npm --prefix web/dashboard ci --audit=false --registry=https://registry.npmjs.org --replace-registry-host=always
          npm --prefix web/dashboard run lint
          npm --prefix web/dashboard test
          npm --prefix web/dashboard run build
          npm --prefix web/dashboard audit --registry=https://registry.npmjs.org --audit-level=high
          test -s internal/dashboard/dist/index.html
          python3 scripts/sync-openapi.py --check
      - name: Scan tracked files for release secrets
        run: python3 scripts/secret-scan.py
      - name: Check source layout and toolchain pins
        run: |
          python3 scripts/check-source-layout.py
          python3 scripts/check-toolchain.py
      - name: Check patch whitespace
        shell: bash
        run: git diff --check HEAD^ HEAD
      - name: Verify Go modules
        run: go mod verify
      - name: Run tests
        run: go test -covermode=atomic -coverprofile=coverage.out ./...
      - name: Run behavior contract and state-machine tests
        run: go test -count=1 ./internal/afdp ./internal/controller ./internal/dataplane ./internal/duplex ./internal/node -run 'Contract|StateMachine'
      - name: Publish coverage summary
        shell: bash
        run: |
          set -euo pipefail
          go tool cover -func=coverage.out | tee coverage.txt
          {
            echo "### Go coverage"
            echo '```'
            tail -n 1 coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage profile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: go-coverage-linux
          path: coverage.out
      - name: Run race tests
        run: go test -race ./...
      - name: Run vet
        run: go vet ./...
      - name: Run staticcheck
        # SA1019 is intentionally excluded here: the pinned gRPC client API
        # remains supported through the current 1.x line, while generated
        # protobuf exporters are emitted by protoc and cannot be edited by
        # hand. Keep all correctness/style checks enabled.
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.6.1 -checks=all,-SA1019 ./...
      - name: Run vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - name: Verify QUIC implementation migration
        shell: bash
        run: |
          ! git grep -n "golang.org/x/net/quic" -- '*.go'
          git grep -n "github.com/quic-go/quic-go" -- internal/afdp internal/dataplane
          ! git grep -n -E "internal/(agent|gateway|relay|transport|configstore|observability)" -- '*.go'
      - name: Build binary
        run: go build ./cmd/asterferry
      - name: Build binary with embedded Dashboard
        run: |
          mkdir -p tmp/ci-bin
          go build -tags=dashboard_assets -o tmp/ci-bin/asterferry-dashboard ./cmd/asterferry
      - name: Set up Helm
        uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4
      - name: Lint Helm chart
        run: |
          helm lint deploy/helm/asterferry-controller --set image.repository=asterferry --set image.tag=ci
          helm lint deploy/helm/asterferry-node --set image.repository=asterferry --set image.tag=ci
      - name: Render Node chart
        run: helm template node deploy/helm/asterferry-node --set image.repository=asterferry --set image.tag=ci
      - name: Render Controller chart
        run: helm template controller deploy/helm/asterferry-controller --set image.repository=asterferry --set image.tag=ci
      - name: Render Controller HA chart
        run: |
          helm template controller deploy/helm/asterferry-controller \
            --set image.repository=asterferry \
            --set image.tag=ci \
            --set controller.highAvailability.enabled=true \
            --set controller.replicas=2 \
            --set controller.highAvailability.existingSecret=asterferry-controller-identity
      - name: Package Helm chart
        shell: bash
        run: |
          mkdir -p tmp/ci-chart
          helm package deploy/helm/asterferry-controller --destination tmp/ci-chart
          helm package deploy/helm/asterferry-node --destination tmp/ci-chart

  dashboard_compatibility:
    name: Dashboard compatibility (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up compatibility Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: web/dashboard/package-lock.json
      - name: Pin compatibility npm
        run: npm install --global npm@11.0.0 --registry=https://registry.npmjs.org
      - name: Verify Dashboard compatibility lane
        run: |
          npm --prefix web/dashboard ci --audit=false --registry=https://registry.npmjs.org --replace-registry-host=always
          npm --prefix web/dashboard run lint
          npm --prefix web/dashboard test
          npm --prefix web/dashboard run build
          npm --prefix web/dashboard audit --registry=https://registry.npmjs.org --audit-level=high

  windows:
    name: Go checks (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.7"
          cache: true
      - name: Verify Go modules
        run: go mod verify
      - name: Scan tracked files for release secrets
        run: python scripts/secret-scan.py
      - name: Run tests
        run: go test ./...
      - name: Run behavior contract and state-machine tests
        run: go test -count=1 ./internal/afdp ./internal/controller ./internal/dataplane ./internal/duplex ./internal/node -run 'Contract|StateMachine'
      - name: Run Windows Controller/Gateway/Agent smoke test
        run: go test -tags=integration -count=1 -timeout=5m ./internal/integration
      - name: Run race tests
        run: go test -race ./...
      - name: Run vet
        run: go vet ./...
      - name: Build binary
        run: go build ./cmd/asterferry

  e2e:
    name: Go QUIC end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.7"
          cache: true
      - name: Run Controller/Gateway/Agent QUIC end-to-end test
        run: go test -tags=integration -count=1 -timeout=5m ./internal/integration

  protocol_fuzz:
    name: AFDP and control-wire fuzz smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.7"
          cache: true
      - name: Fuzz AFDP decoders
        run: go test ./internal/afdp -run '^$' -fuzz FuzzDecodeAFDPFrames -fuzztime 20s
      - name: Fuzz control-wire decoders
        run: go test ./internal/controlwire -run '^$' -fuzz FuzzControlwireDecoders -fuzztime 20s

  performance:
    name: Protocol benchmark regression gate
    if: github.event_name == 'pull_request'
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.7"
          cache: true
      - name: Compare protocol benchmarks with base
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: bash scripts/bench-regression.sh "$GITHUB_BASE_REF"

  image:
    name: Build manually requested development image
    if: github.event_name == 'workflow_dispatch' && inputs.build_image == true
    needs: [test, dashboard_compatibility, e2e, protocol_fuzz]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build local image (never publish)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: asterferry:workflow-${{ github.sha }}
          build-args: |
            VERSION=dev
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release_build:
    name: Build release artifacts
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, dashboard_compatibility, e2e, protocol_fuzz]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.7"
          cache: true
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: web/dashboard/package-lock.json
      - name: Pin npm toolchain
        run: npm install --global npm@12.0.2 --registry=https://registry.npmjs.org
      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]] || {
            echo "release tags must match vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-rc.N" >&2
            exit 1
          }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "release tag must point at a commit reachable from main" >&2
            exit 1
          }
          version="${GITHUB_REF_NAME#v}"
          stable_version="${version%%-rc.*}"
          python3 - "$version" "$stable_version" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          tag_version = sys.argv[1]
          stable_version = sys.argv[2]
          versions = {}

          for path in (Path("api/openapi.yaml"), Path("internal/controller/openapi.yaml")):
              text = path.read_text(encoding="utf-8")
              match = re.search(r"(?m)^  version:\s*(\S+)\r?$", text)
              if not match:
                  raise SystemExit(f"{path} does not declare info.version")
              versions[str(path)] = match.group(1)

          versions["web/dashboard/package.json"] = json.loads(
              Path("web/dashboard/package.json").read_text(encoding="utf-8")
          )["version"]
          versions["web/dashboard/package-lock.json"] = json.loads(
              Path("web/dashboard/package-lock.json").read_text(encoding="utf-8")
          )["packages"][""]["version"]

          for chart in ("deploy/helm/asterferry-controller", "deploy/helm/asterferry-node"):
              path = Path(chart) / "Chart.yaml"
              text = path.read_text(encoding="utf-8")
              chart_version = re.search(r"(?m)^version:\s*(\S+)\r?$", text)
              app_version = re.search(r'(?m)^appVersion:\s*"?([^"\s]+)"?\r?$', text)
              if not chart_version or not app_version:
                  raise SystemExit(f"{path} is missing chart version metadata")
              versions[f"{path} version"] = chart_version.group(1)
              versions[f"{path} appVersion"] = app_version.group(1)

          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          heading = rf"(?m)^## \[{re.escape(stable_version)}\] - (?:Unreleased|\d{{4}}-\d{{2}}-\d{{2}})\r?$"
          if not re.search(heading, changelog):
              raise SystemExit(f"CHANGELOG.md has no entry for {stable_version}")

          mismatches = {path: value for path, value in versions.items() if value != stable_version}
          if mismatches:
              details = ", ".join(f"{path}={value}" for path, value in mismatches.items())
              raise SystemExit(f"release version {stable_version} is inconsistent: {details}")
          if len(set(versions.values())) != 1:
              raise SystemExit(f"release version sources disagree: {versions}")
          print(f"release tag {tag_version} is consistent with stable source version {stable_version}")
          PY
      - name: Verify generated sources and layout
        run: |
          python3 scripts/sync-openapi.py --check
          python3 scripts/check-source-layout.py
          python3 scripts/check-toolchain.py
      - name: Verify dashboard assets
        run: |
          npm --prefix web/dashboard ci --audit=false --registry=https://registry.npmjs.org --replace-registry-host=always
          npm --prefix web/dashboard run build
          test -s internal/dashboard/dist/index.html
          test -z "$(git ls-files -- internal/dashboard/dist)"
      - name: Run release protocol benchmarks
        run: go test ./internal/afdp ./internal/controlwire ./internal/dataplane -run '^$' -bench '^Benchmark' -benchmem -benchtime=3s -count=5
      - name: Build native release archives
        uses: goreleaser/goreleaser-action@9c156ee8a17a598857849441385a2041ef570552 # v6.3.0
        with:
          distribution: goreleaser
          version: v2.9.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Package release installers
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/install-controller.sh scripts/install-node.sh
          cp scripts/install-controller.ps1 dist/install-controller.ps1
          cp scripts/install-node.sh dist/install-node.sh
          cp scripts/install-node.ps1 dist/install-node.ps1
          cp scripts/install-controller.sh dist/install-controller.sh
          version="${GITHUB_REF_NAME#v}"
          python3 - "$version" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          version = sys.argv[1]
          repository = os.environ["GITHUB_REPOSITORY"]
          metadata = {
              "schema_version": 1,
              "version": version,
              "release_base_url": f"https://github.com/{repository}/releases/download",
              "artifacts": {
                  "linux/amd64": f"asterferry_{version}_linux_amd64.tar.gz",
                  "linux/arm64": f"asterferry_{version}_linux_arm64.tar.gz",
                  "windows/amd64": f"asterferry_{version}_windows_amd64.zip",
              },
          }
          Path("dist/node-release.json").write_text(json.dumps(metadata, indent=2) + "\n", encoding="utf-8")

          controller_path = Path("dist/install-controller.ps1")
          controller_text = controller_path.read_text(encoding="utf-8")
          embedded_values = {
              '$script:embeddedReleaseBaseUrl = ""': f'$script:embeddedReleaseBaseUrl = {json.dumps(metadata["release_base_url"])}',
              '$script:embeddedReleaseVersion = ""': f'$script:embeddedReleaseVersion = {json.dumps(version)}',
          }
          for marker, replacement in embedded_values.items():
              if controller_text.count(marker) != 1:
                  raise SystemExit(f"expected exactly one Controller installer marker: {marker}")
              controller_text = controller_text.replace(marker, replacement, 1)
          controller_path.write_text(controller_text, encoding="utf-8")
          PY
          pwsh -NoLogo -NoProfile -Command "[scriptblock]::Create((Get-Content -Raw -LiteralPath 'scripts/install-controller.ps1')) | Out-Null; [scriptblock]::Create((Get-Content -Raw -LiteralPath 'scripts/install-node.ps1')) | Out-Null; [scriptblock]::Create((Get-Content -Raw -LiteralPath 'dist/install-controller.ps1')) | Out-Null"
      - name: Generate source SBOM
        uses: anchore/sbom-action@da167eac915b4e86f08b264dbdbc867b61be6f0c # v0.20.5
        with:
          path: .
          format: spdx-json
          output-file: dist/asterferry-${{ github.ref_name }}-source.spdx.json
          artifact-name: asterferry-${{ github.ref_name }}-source-sbom
          syft-version: v1.51.0
          upload-artifact: false
          upload-release-assets: false
      - name: Validate release files
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          expected_files=(
            "asterferry_${version}_linux_amd64.tar.gz"
            "asterferry_${version}_linux_arm64.tar.gz"
            "asterferry_${version}_windows_amd64.zip"
            "asterferry-${GITHUB_REF_NAME}-source.spdx.json"
            "install-controller.ps1"
            "install-controller.sh"
            "install-node.sh"
            "install-node.ps1"
            "node-release.json"
          )
          for file in "${expected_files[@]}"; do
            test -s "dist/$file" || { echo "release file missing or empty: $file" >&2; exit 1; }
          done
          test "$(find dist -maxdepth 1 -type f -name '*.tgz' | wc -l)" -eq 0
      - name: Create release checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          mapfile -t checksum_inputs < <(find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.spdx.json' -o -name '*.sh' -o -name '*.ps1' -o -name 'node-release.json' \) -printf '%f\n' | sort)
          ((${#checksum_inputs[@]} > 0)) || { echo "no release files found for checksums" >&2; exit 1; }
          sha256sum "${checksum_inputs[@]}" > SHA256SUMS
          sha256sum -c SHA256SUMS
          for file in "${checksum_inputs[@]}"; do
            grep -Fq "  $file" SHA256SUMS || { echo "release checksum missing: $file" >&2; exit 1; }
          done
      - name: Upload release build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ github.ref_name }}
          path: dist
          if-no-files-found: error
          retention-days: 7

  release_publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - release_build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download release build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-${{ github.ref_name }}
          path: dist
      - name: Create release manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          dist = Path("dist")
          artifacts = []
          for line in (dist / "SHA256SUMS").read_text(encoding="utf-8").splitlines():
              digest, name = line.split(maxsplit=1)
              artifacts.append({"name": name, "sha256": digest})
          version = os.environ["GITHUB_REF_NAME"][1:]
          manifest = {
              "version": version,
              "tag": os.environ["GITHUB_REF_NAME"],
              "commit": os.environ["GITHUB_SHA"],
              "protocol": "AFDP/2 + control/3",
              "optional_resources": {
                  "geoip": {
                      "included": False,
                      "provisioning": "operator-supplied versioned MaxMind-compatible database",
                      "max_age_days": 180,
                  }
              },
              "artifacts": artifacts,
          }
          (dist / "release-manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n", encoding="utf-8"
          )
          PY
      - name: Attest release files
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.spdx.json
            dist/*.sh
            dist/*.ps1
            dist/node-release.json
            dist/SHA256SUMS
            dist/release-manifest.json
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          release_flags=(--repo "$GITHUB_REPOSITORY" --title "AsterFerry $GITHUB_REF_NAME" --generate-notes --verify-tag)
          if [[ "$GITHUB_REF_NAME" == *-rc.* ]]; then
            release_flags+=(--prerelease)
          fi
          release_assets=(
            dist/*.tar.gz
            dist/*.zip
            dist/*.spdx.json
            dist/*.sh
            dist/*.ps1
            dist/node-release.json
            dist/SHA256SUMS
            dist/release-manifest.json
          )
          for asset in "${release_assets[@]}"; do
            test -f "$asset" || { echo "release asset missing or not a file: $asset" >&2; exit 1; }
          done
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${release_assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${release_assets[@]}" "${release_flags[@]}"
          fi
